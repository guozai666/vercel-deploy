<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开屏广告叠加工具</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 20px; }
    h1 { text-align: center; color: #e94560; margin-bottom: 10px; font-size: 22px; }
    .subtitle { text-align: center; color: #888; margin-bottom: 25px; font-size: 14px; }
    .container { max-width: 900px; margin: 0 auto; }
    .preview-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
    .preview-box { background: #16213e; border: 2px solid #0f3460; border-radius: 12px; padding: 15px; text-align: center; }
    .preview-box h3 { color: #e94560; margin-bottom: 8px; font-size: 15px; }
    .preview-box img { max-width: 100%; max-height: 220px; border-radius: 6px; background: #000; }
    .preview-box p { color: #666; font-size: 13px; margin-top: 8px; }
    
    .source-section { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .source-section h3 { color: #e94560; margin-bottom: 15px; font-size: 15px; }
    .source-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; background: #0f3460; border: none; border-radius: 8px; color: #888; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .tab-btn.active { background: #e94560; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .upload-box { background: #16213e; border: 2px dashed #0f3460; border-radius: 12px; padding: 25px; text-align: center; cursor: pointer; transition: border-color 0.3s; }
    .upload-box:hover { border-color: #e94560; }
    .upload-box.dragover { border-color: #e94560; background: #1f2b5a; }
    .upload-box p { color: #888; font-size: 14px; }
    .upload-box img { max-width: 100%; max-height: 200px; margin-top: 10px; border-radius: 8px; }
    input[type="file"] { display: none; }
    
    .url-input-wrap { display: flex; gap: 10px; }
    .url-input { flex: 1; padding: 12px 15px; background: #0f3460; border: 2px solid #0f3460; border-radius: 8px; color: #eee; font-size: 14px; outline: none; transition: border-color 0.3s; }
    .url-input:focus { border-color: #e94560; }
    .url-input::placeholder { color: #666; }
    .load-url-btn { padding: 12px 20px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
    .load-url-btn:hover { background: #c73e54; }
    .url-preview { margin-top: 15px; text-align: center; }
    .url-preview img { max-width: 100%; max-height: 200px; border-radius: 8px; background: #000; }
    
    .controls { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .btn { padding: 12px 30px; background: #e94560; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    .btn:hover { background: #c73e54; }
    .btn:disabled { background: #555; cursor: not-allowed; }
    .btn-secondary { background: #0f3460; }
    .btn-secondary:hover { background: #1a4a7a; }
    
    .result { background: #16213e; border-radius: 12px; padding: 20px; text-align: center; }
    .result h3 { color: #e94560; margin-bottom: 15px; }
    #resultCanvas { max-width: 100%; border-radius: 8px; background: #000; }
    .download-btn { margin-top: 15px; padding: 12px 30px; background: #0f3460; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
    .download-btn:hover { background: #1a4a7a; }
    
    .loading { color: #e94560; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🖼️ 开屏广告叠加工具</h1>
    <p class="subtitle">上层广告图固定，只需上传下层背景图，然后叠加生成</p>
    
    <div class="preview-area">
      <div class="preview-box">
        <h3>📤 上层（已固定）</h3>
        <img src="开屏预览图.png" alt="上层广告图" id="topPreview">
        <p>广告UI层 · 1080×2400</p>
      </div>
      <div class="preview-box">
        <h3>📤 下层（待设置）</h3>
        <img id="bottomPreviewImg" style="display:none;">
        <p id="bottomPreviewLabel" style="margin-top:60px;color:#555;">点击下方选择图片来源</p>
      </div>
    </div>
    
    <div class="source-section">
      <h3>📥 下层图片来源</h3>
      <div class="source-tabs">
        <button class="tab-btn active" onclick="switchTab('upload')">📁 本地上传</button>
        <button class="tab-btn" onclick="switchTab('url')">🔗 图片链接</button>
      </div>
      
      <div id="tab-upload" class="tab-content active">
        <div class="upload-box" id="drop2" onclick="document.getElementById('file2').click()">
          <p>点击或拖拽上传 JPG/PNG 图片</p>
          <input type="file" id="file2" accept="image/*">
          <div id="preview2"></div>
        </div>
      </div>
      
      <div id="tab-url" class="tab-content">
        <div class="url-input-wrap">
          <input type="text" id="imgUrl" class="url-input" placeholder="粘贴图片直链地址（以 .jpg/.png/.gif 结尾）">
          <button class="load-url-btn" onclick="loadFromUrl()">加载</button>
        </div>
        <div id="urlPreview" class="url-preview"></div>
      </div>
    </div>
    
    <div class="controls">
      <button class="btn" id="generateBtn" onclick="generate()">⚡ 生成叠加图</button>
      <button class="btn btn-secondary" onclick="resetAll()">🔄 重置</button>
    </div>
    
    <div class="result" id="resultArea" style="display:none;">
      <h3>📸 叠加结果</h3>
      <canvas id="resultCanvas"></canvas>
      <button class="download-btn" onclick="downloadResult()">⬇️ 下载结果 PNG</button>
    </div>
  </div>

  <script>
    let topImg = new Image();
    topImg.onload = () => console.log('上层图加载成功:', topImg.width, 'x', topImg.height);
    topImg.src = './开屏预览图.png';

    let bottomImg = null;

    // Tab 切换
    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelector(`[onclick="switchTab('${tab}')"]`).classList.add('active');
      document.getElementById(`tab-${tab}`).classList.add('active');
    }

    // 本地上传
    document.getElementById('file2').addEventListener('change', (e) => {
      if (e.target.files[0]) loadFile(e.target.files[0]);
    });

    const drop2 = document.getElementById('drop2');
    drop2.addEventListener('dragover', (e) => { e.preventDefault(); drop2.classList.add('dragover'); });
    drop2.addEventListener('dragleave', () => drop2.classList.remove('dragover'));
    drop2.addEventListener('drop', (e) => {
      e.preventDefault();
      drop2.classList.remove('dragover');
      if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    function loadFile(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          bottomImg = img;
          document.getElementById('preview2').innerHTML = `<img src="${e.target.result}" alt="预览">`;
          updateBottomPreview(e.target.result, '本地上传');
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // URL 加载
    function loadFromUrl() {
      const url = document.getElementById('imgUrl').value.trim();
      if (!url) { alert('请先输入图片链接'); return; }
      
      document.getElementById('urlPreview').innerHTML = '<p class="loading">⏳ 加载中...</p>';
      
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = () => {
        bottomImg = img;
        document.getElementById('urlPreview').innerHTML = `<img src="${url}" alt="链接预览">`;
        updateBottomPreview(url, '链接加载');
      };
      img.onerror = () => {
        document.getElementById('urlPreview').innerHTML = '<p style="color:#e94560;">❌ 加载失败，请检查链接是否有效</p>';
      };
      img.src = url;
    }

    function updateBottomPreview(src, label) {
      const img = document.getElementById('bottomPreviewImg');
      const labelEl = document.getElementById('bottomPreviewLabel');
      img.src = src;
      img.style.display = 'block';
      labelEl.style.display = 'none';
    }

    function generate() {
      if (!bottomImg) { alert('请先设置下层图片'); return; }
      if (!topImg.complete) { alert('上层图加载中，请稍候'); return; }
      
      const canvas = document.getElementById('resultCanvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = bottomImg.width;
      canvas.height = bottomImg.height;
      
      ctx.drawImage(bottomImg, 0, 0);
      
      const scaleX = canvas.width / topImg.width;
      const scaleY = canvas.height / topImg.height;
      const scale = Math.min(scaleX, scaleY);
      const scaledW = topImg.width * scale;
      const scaledH = topImg.height * scale;
      const dx = (canvas.width - scaledW) / 2;
      const dy = (canvas.height - scaledH) / 2;
      
      ctx.drawImage(topImg, dx, dy, scaledW, scaledH);
      
      document.getElementById('resultArea').style.display = 'block';
    }

    function downloadResult() {
      const canvas = document.getElementById('resultCanvas');
      const link = document.createElement('a');
      link.download = '开屏广告_叠加.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function resetAll() {
      bottomImg = null;
      document.getElementById('preview2').innerHTML = '';
      document.getElementById('file2').value = '';
      document.getElementById('imgUrl').value = '';
      document.getElementById('urlPreview').innerHTML = '';
      document.getElementById('bottomPreviewImg').style.display = 'none';
      document.getElementById('bottomPreviewImg').src = '';
      document.getElementById('bottomPreviewLabel').style.display = '';
      document.getElementById('resultArea').style.display = 'none';
    }
  </script>
</body>
</html>
